name: Feature request
description: Suggest an idea for astria
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The workflow or question you're trying to handle, not just the feature. "When I'm doing X, the graph can't tell me Y."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd want the command/output/API to look like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you've considered.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to help implement this (see CONTRIBUTING.md)
  - type: markdown
    attributes:
      value: |
        Design note: the project's core constraint is **deterministic, offline-first extraction**. Features that require an LLM are acceptable but must be opt-in and provenance-labeled (`INFERRED`).
