name: Publish to the official MCP Registry
description: >-
  Exchanges the calling job's OIDC token for a registry token and publishes
  server.json. The calling job needs `id-token: write`.

# Shared by the tag-driven publish job in release.yml and by its manual
# publish-registry job, so the publisher is pinned in exactly one place.
runs:
  using: composite
  steps:
    - name: Publish to the official MCP Registry
      # `login github-oidc` exchanges the job's OIDC token for a registry
      # token and only permits io.github.<owner>/ namespaces — server.json
      # must match the org login's exact case (Nodesify).
      # The publisher is pinned and checksum-verified like the SHA-pinned
      # actions in the workflows: this step runs with the job's OIDC token,
      # so a floating releases/latest download would execute whatever the
      # registry repo most recently shipped. Bump the tag and sha256
      # together, deliberately. Linux only: the callers run on ubuntu.
      shell: bash
      env:
        MCP_PUBLISHER_TAG: v1.8.1
        MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      run: |
        curl -fsSL -o mcp-publisher.tar.gz \
          "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_TAG}/mcp-publisher_linux_amd64.tar.gz"
        echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check -
        tar xzf mcp-publisher.tar.gz mcp-publisher
        ./mcp-publisher login github-oidc
        ./mcp-publisher publish
