name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

# audit-check needs checks:write: when it finds warnings (unmaintained /
# yanked crates) it creates a check run with annotations, which fails with
# "Resource not accessible by integration" under a read-only token (#38).
# Called workflows may downgrade but not elevate the caller's token scopes,
# so the `ci` job in release.yml grants the same two scopes. Keep them in
# sync if either side changes.
permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable # branch ref on purpose: tracks latest stable Rust; not SHA-pinned so updates keep flowing
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Security audit
        # OS-independent: run once, not per matrix leg.
        if: matrix.os == 'ubuntu-latest'
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # ttf-parser (via lopdf <- pdf-extract) is unmaintained upstream with
          # no fixed version or alternative wired into pdf-extract yet; it only
          # reads embedded font metrics, not untrusted font files. Re-evaluate
          # when pdf-extract migrates (suggested successor: skrifa).
          ignore: RUSTSEC-2026-0192
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

  cli-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Check @napi-rs/cli version drift
        run: node scripts/check-napi-version.mjs
      - uses: dtolnay/rust-toolchain@stable # branch ref on purpose: tracks latest stable Rust; not SHA-pinned so updates keep flowing
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        # npm install (not ci) is deliberate: --install-strategy=nested shapes
        # node_modules for the napi build; the drift check above guards the
        # lockfile dependency this bypasses.
        run: cd packages/astria-cli && npm install --install-strategy=nested
      - name: Build native module
        env:
          NAPI_RS_CLI_VERSION: '2.18.4'
        run: cargo build --release --locked -p astria-napi
      - name: Copy native module
        shell: bash
        run: |
          mkdir -p packages/astria-cli/dist
          for lib in target/release/libastria_napi.so target/release/libastria_napi.dylib target/release/astria_napi.dll; do
            if [ -f "$lib" ]; then
              cp "$lib" packages/astria-cli/dist/astria.node
              break
            fi
          done
      - name: Build CLI
        run: cd packages/astria-cli && npm run build
      - name: Run CLI tests
        run: cd packages/astria-cli && npm test

  npm-audit:
    # JS-side dependency audit: cargo has rustsec/audit-check, the CLI's npm
    # dependencies get the equivalent here. Works off package-lock.json, no
    # install needed. Dev-only advisories below high don't fail the build.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
