name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

# Least-privilege default: jobs that need more declare it explicitly.
# The audit-check step needs checks:write — when it finds warnings
# (unmaintained / yanked crates) it creates a check run with annotations,
# which fails with "Resource not accessible by integration" under a
# read-only token (#38). Called workflows may downgrade but not elevate
# the caller's token scopes, so release.yml's `ci` job must still grant
# checks:write for that step to work when CI is called from a release.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The audit step is the only thing here that creates check runs.
    permissions:
      contents: read
      checks: write
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # branch ref on purpose: tracks latest stable Rust; not SHA-pinned so updates keep flowing
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Security audit
        # OS-independent: run once, not per matrix leg.
        if: matrix.os == 'ubuntu-24.04'
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # ttf-parser (via lopdf <- pdf-extract) is unmaintained upstream with
          # no fixed version or alternative wired into pdf-extract yet; it only
          # reads embedded font metrics, not untrusted font files. Re-evaluate
          # when pdf-extract migrates (suggested successor: skrifa).
          ignore: RUSTSEC-2026-0192
      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

  cli-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          # Root lockfile governs the workspace; the CLI install reads it.
          cache-dependency-path: package-lock.json
      - name: Check @napi-rs/cli version drift
        run: node scripts/check-napi-version.mjs
      - uses: dtolnay/rust-toolchain@stable # branch ref on purpose: tracks latest stable Rust; not SHA-pinned so updates keep flowing
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        # npm ci is reproducible: the root .npmrc pins install-strategy
        # and the lockfile encodes the nested tree the napi build expects.
        run: cd packages/astria-cli && npm ci
      - name: Build native module
        env:
          NAPI_RS_CLI_VERSION: '3.10.8'
        run: cargo build --release --locked -p astria-napi
      - name: Copy native module
        shell: bash
        run: |
          mkdir -p packages/astria-cli/dist
          for lib in target/release/libastria_napi.so target/release/libastria_napi.dylib target/release/astria_napi.dll; do
            if [ -f "$lib" ]; then
              cp "$lib" packages/astria-cli/dist/astria.node
              break
            fi
          done
      - name: Build CLI
        run: cd packages/astria-cli && npm run build
      - name: Run CLI tests
        run: cd packages/astria-cli && npm test

  npm-audit:
    # JS-side dependency audit: cargo has rustsec/audit-check, the CLI's npm
    # dependencies get the equivalent here. Works off package-lock.json, no
    # install needed. Dev-only advisories below high don't fail the build.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  docs-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Docs vs code drift guard
        run: node scripts/check-docs-sync.mjs
      - name: Install viewer toolchain
        # esbuild is needed to rebuild the viewer bundle for the drift check.
        run: npm install --no-audit --no-fund
      - name: Viewer bundle drift guard
        run: node scripts/check-viewer-bundle.mjs
