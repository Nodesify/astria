# Probe: keeps validating the musl cdylib story, the way the release builds
# it — inside an Alpine image, where the toolchain is musl. rustc >= 1.99
# enabled static-PIE on all musl targets, and a static-PIE target cannot
# emit a cdylib, so the release leg passes -crt-static. The matrix encodes
# both sides of that condition, so this workflow stays the canary on
# release-workflow changes.
# It also checks what the artifact is linked against and loads it on musl.
# Until 1.7.0 the release built this leg on the Ubuntu host, where that
# workaround silently produced a glibc-linked binary; this probe printed
# the linkage and never read it, and the release's own check skipped the
# load.
name: musl probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/musl-probe.yml
      - .github/workflows/release.yml

# Read-only probe: builds, inspects and loads artifacts; never pushes.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The counter-flag (must succeed) and the status quo (must fail):
        # the second leg asserts the KNOWN rustc >= 1.99 condition — no
        # cdylib without -crt-static — so it stays green while that holds
        # and turns red the day rustc fixes it. That red is the signal to
        # drop the -crt-static workaround from release.yml.
        rustflags: ["-C target-feature=-crt-static", ""]
        include:
          - rustflags: ""
            expected-failure: true
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (no-default-features, as the release leg does, inside Alpine)
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e RUSTFLAGS rust:1-alpine sh -ec '
            apk add --no-cache musl-dev gcc binutils >/dev/null
            cargo build --release --locked --target x86_64-unknown-linux-musl -p astria-napi --no-default-features
          '
      - name: Report artifact
        run: |
          echo "RUSTFLAGS='${{ matrix.rustflags }}'"
          ls -la target/x86_64-unknown-linux-musl/release/ | grep -E "libastria|cdylib" || echo "NO CDYLIB ARTIFACT"
          if [ "${{ matrix.expected-failure }}" = "true" ]; then
            ! test -f target/x86_64-unknown-linux-musl/release/libastria_napi.so
          else
            test -f target/x86_64-unknown-linux-musl/release/libastria_napi.so
          fi
      - name: It must be a musl binary, and load as one
        if: matrix.expected-failure != true
        run: |
          so=target/x86_64-unknown-linux-musl/release/libastria_napi.so
          file "$so"
          readelf -d "$so" | head -12
          if readelf -d "$so" | grep NEEDED | grep -qE "libc\.so\.6|ld-linux"; then
            echo "::error::$so is linked against glibc, which a musl system cannot load"
            exit 1
          fi
          docker run --rm -v "$PWD:/work" -w /work node:22-alpine node -e '
            process.dlopen(module, process.argv[1]);
            if (typeof module.exports.runPipeline !== "function") throw new Error("native module exports nothing");
            console.log("loaded in Alpine: " + Object.keys(module.exports).length + " exports");
          ' "./$so"
