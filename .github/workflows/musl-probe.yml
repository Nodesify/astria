# Probe: keeps validating the musl cdylib story. rustc >= 1.99 enabled
# static-PIE on all musl targets — and a static-PIE target cannot emit a
# cdylib, so the release's linux-x64-musl leg produced no artifact
# ("dropping unsupported crate type cdylib") until -crt-static was baked
# into release.yml. The matrix below encodes both sides of that condition,
# so this workflow now acts as the canary on release-workflow changes.
name: musl probe
on:
  workflow_dispatch:
    inputs:
      rustflags:
        description: "RUSTFLAGS to test (empty = status quo)"
        required: false
        default: "-C target-feature=-crt-static"
  pull_request:
    paths:
      - .github/workflows/musl-probe.yml
      - .github/workflows/release.yml

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The counter-flag (must succeed) and the status quo (must fail):
        # the second leg asserts the KNOWN rustc >= 1.99 condition — no
        # cdylib without -crt-static — so it stays green while that holds
        # and turns red the day rustc fixes it. That red is the signal to
        # drop the -crt-static workaround from release.yml. (The previous
        # continue-on-error approach kept the workflow green but still
        # reported the check run as FAILURE — red on every PR hides real
        # failures.)
        rustflags: ["-C target-feature=-crt-static", ""]
        include:
          - rustflags: ""
            expected-failure: true
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (no-default-features, as the release leg does)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p astria-napi --no-default-features
      - name: Report artifact
        run: |
          echo "RUSTFLAGS='${{ matrix.rustflags }}'"
          ls -la target/x86_64-unknown-linux-musl/release/ | grep -E "libastria|cdylib" || echo "NO CDYLIB ARTIFACT"
          if [ "${{ matrix.expected-failure }}" = "true" ]; then
            ! test -f target/x86_64-unknown-linux-musl/release/libastria_napi.so
          else
            test -f target/x86_64-unknown-linux-musl/release/libastria_napi.so
          fi
      - name: Smoke-load the .so
        if: matrix.expected-failure != true
        run: |
          file target/x86_64-unknown-linux-musl/release/libastria_napi.so
          readelf -d target/x86_64-unknown-linux-musl/release/libastria_napi.so | head -12
