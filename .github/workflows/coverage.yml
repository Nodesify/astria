name: Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Test density is wildly uneven across crates (extract has 57 tests, report
# has 2). This workflow makes the gaps visible on every PR; it is
# informational on purpose — no threshold gate until the numbers have a
# baseline to compare against. The lcov artifact is downloadable from the
# run page for line-level inspection.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # branch ref on purpose: tracks latest stable Rust; not SHA-pinned so updates keep flowing
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}-cov
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: cargo llvm-cov --workspace --locked --no-fail-fast --lcov --output-path lcov.info
      - name: Per-crate summary
        if: always()
        # Ratchet: baseline measured 2026-10-07 at 79.46% lines (full
        # workspace, default features). The floor sits ~4.5 points under
        # the baseline to absorb cross-platform variance while still
        # catching real regressions. Raise it as coverage grows; never
        # lower it.
        run: cargo llvm-cov --workspace --locked --summary-only --fail-under-lines 75
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
