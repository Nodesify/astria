name: Source retrieval quality
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # Same build/wire-up sequence as ci.yml's cli-test legs, kept in
      # lockstep by the shared composite action. The recall floor comes
      # from run-quality.mjs itself (default 50) instead of a duplicated
      # flag here.
      - uses: ./.github/actions/build-cli
      - name: Install shared exact tokenizer
        run: npm install --no-save js-tiktoken
      - name: Build source graph and gate retrieval
        run: |
          node packages/astria-cli/dist/index.js run .
          node scripts/bench/quality/run-quality.mjs --astria "$GITHUB_WORKSPACE/packages/astria-cli/dist/index.js"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: source-retrieval-quality
          path: scripts/bench/quality/out/quality-results.json
