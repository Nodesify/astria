name: Release

on:
  push:
    tags:
      - 'v*'
  # Dispatch = rehearsal: runs ci + verify + the full build matrix +
  # rehearse-pack (npm publish --dry-run). Nothing is published — the
  # publish job only runs on v* tag pushes, so a stray click can never
  # publish from a branch.
  workflow_dispatch:

# Least-privilege default: jobs that need more declare it explicitly.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # ci.yml defaults to contents:read top-level and elevates checks:write
    # only on its audit job; called workflows may downgrade but not elevate
    # the caller's scopes, so this caller must grant checks:write for the
    # audit step to create its check run.
    permissions:
      contents: read
      checks: write

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches package version
        # Fail before the 5-leg build matrix spends 30+ minutes on a tag
        # that cannot publish (the v0.8.0 re-tag churn, #46).
        # Tag-gated: a workflow_dispatch rehearsal runs from a branch, where
        # the ref name is not a tag.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg_version=$(node -p "require('./packages/astria-cli/package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/astria-cli/package.json version ${pkg_version}"
            exit 1
          fi
      - name: Verify changelog section exists for the tag
        # Same fail-fast rationale: a tag whose [Unreleased] entries were
        # never promoted to a dated "## [X.Y.Z]" heading would publish a
        # release without curated notes. The publish job feeds the extracted
        # section to the GitHub Release body.
        # Tag-gated for the same reason as the tag/version check above.
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/extract-changelog.mjs "${GITHUB_REF_NAME#v}" --check
      - name: Verify MCP Registry server.json matches the tag
        # The official MCP Registry requires server.json, package.json and the
        # npm package to agree on version AND name. v1.0.9 shipped a lowercase
        # mcpName that could never validate against the io.github.Nodesify/*
        # OIDC grant — and because npm is immutable, the mismatch was only
        # discoverable after publish, unfixable without burning a version.
        # Check every field the registry compares before the build matrix
        # spends 30+ minutes.
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const server = JSON.parse(fs.readFileSync('server.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('packages/astria-cli/package.json', 'utf8'));
          const problems = [];
          if (server.version !== pkg.version)
            problems.push(`server.json version ${server.version} != package.json version ${pkg.version}`);
          if (!pkg.mcpName)
            problems.push('package.json declares no mcpName for the registry namespace');
          if (server.name !== pkg.mcpName)
            problems.push(`server.json name ${server.name} != package.json mcpName ${pkg.mcpName}`);
          const npm = (server.packages || []).find((p) => p.registryType === 'npm');
          if (!npm) {
            problems.push('server.json declares no npm package entry');
          } else {
            if (npm.identifier !== pkg.name)
              problems.push(`server.json npm identifier ${npm.identifier} != package.json name ${pkg.name}`);
            if (npm.version !== pkg.version)
              problems.push(`server.json npm version ${npm.version} != package.json version ${pkg.version}`);
          }
          for (const p of problems) console.error(`::error::${p}`);
          if (problems.length) process.exit(1);
          console.log(`server.json matches package.json: ${server.name} @ ${pkg.version}`);
          EOF

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: [ci, verify]
    # Every advertised platform must produce an artifact.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            lib: libastria_napi.so
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            lib: libastria_napi.so
            # g++-aarch64-linux-gnu: fastembed's C++ deps (tokenizers/onig)
            # link -lstdc++, which the plain C cross-compiler lacks
            setup: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            lib: astria_napi.dll
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
            lib: libastria_napi.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x64
            lib: libastria_napi.dylib
            # ONNX Runtime ships no prebuilt binaries for Intel Mac — this
            # build drops the embed feature (clear runtime error on --embed)
            cargo-flags: --no-default-features
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            lib: libastria_napi.so
            # Native build (no cross toolchain needed on x86_64); musl-tools
            # provides the musl libc link path. No embed: ONNX Runtime ships
            # no musl prebuilt — same policy as darwin-x64, disclosed via
            # graph_stats instead of a runtime surprise.
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
            cargo-flags: --no-default-features
            # rustc 1.99 enabled static-PIE on all musl targets, and a
            # static-PIE target cannot emit a cdylib ("dropping unsupported
            # crate type cdylib" -> no .so -> no artifact). Link against
            # the shared musl libc (musl-tools ships it) to keep cdylib
            # support. Validated by the musl-probe workflow on this PR.
            rustflags: -C target-feature=-crt-static
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: win32-arm64-msvc
            lib: astria_napi.dll
            # No embed until ONNX Runtime's windows-arm64 prebuilts are
            # validated end to end — graph_stats discloses the capability.
            cargo-flags: --no-default-features
    env:
      # Empty for every leg except musl (see its matrix entry).
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # branch ref on purpose: tracks latest stable Rust; not SHA-pinned so updates keep flowing
        with:
          targets: ${{ matrix.target }}
      - name: Setup cross-compilation toolchain
        if: matrix.setup != ''
        run: ${{ matrix.setup }}
      - name: Configure linker
        if: matrix.linker != ''
        run: |
          mkdir -p .cargo
          echo '[target.${{ matrix.target }}]' >> .cargo/config.toml
          echo 'linker = "${{ matrix.linker }}"' >> .cargo/config.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        # npm install (not ci) is deliberate: --install-strategy=nested shapes
        # node_modules for the napi tooling; scripts/check-napi-version.mjs
        # guards the lockfile dependency this bypasses.
        run: cd packages/astria-cli && npm ci
      - name: Build native binary
        env:
          NAPI_RS_CLI_VERSION: '3.10.8'
        run: cargo build --release --locked --target ${{ matrix.target }} -p astria-napi ${{ matrix.cargo-flags }}
      - name: Copy artifact (Linux/macOS)
        if: runner.os != 'Windows'
        # dist/ is untracked (build output) — create it before the copy
        run: mkdir -p packages/astria-cli/dist && cp target/${{ matrix.target }}/release/${{ matrix.lib }} packages/astria-cli/dist/astria.node
      - name: Copy artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir -p packages/astria-cli/dist && cp target/${{ matrix.target }}/release/${{ matrix.lib }} packages/astria-cli/dist/astria.node
      - name: Collect Windows embedding runtime
        if: matrix.platform == 'win32-x64-msvc'
        run: node scripts/copy-native-runtime.mjs target/${{ matrix.target }}/release/build packages/astria-cli/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astria-${{ matrix.platform }}
          path: |
            packages/astria-cli/dist/astria.node
            packages/astria-cli/dist/*.dll

  packed-install:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x64-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-arm64-gnu }
          - { os: windows-latest, platform: win32-x64-msvc }
          - { os: windows-11-arm, platform: win32-arm64-msvc }
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
          - { os: ubuntu-24.04, platform: linux-x64-musl, alpine: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: astria-${{ matrix.platform }}
          path: packages/astria-cli/npm/${{ matrix.platform }}
      - name: Assemble package
        shell: bash
        run: |
          npm ci
          npm run build --workspace @nodesify/astria
          mv packages/astria-cli/npm/${{ matrix.platform }}/astria.node packages/astria-cli/npm/${{ matrix.platform }}/astria.${{ matrix.platform }}.node
          cd packages/astria-cli
          npx napi create-npm-dirs
          node ../../scripts/include-native-runtime.mjs
      - name: Verify packed installation on target OS
        if: matrix.alpine != true
        run: node scripts/check-packed-install.mjs ${{ matrix.platform }}
      - name: Verify packed installation on musl
        if: matrix.alpine == true
        run: docker run --rm -v "$PWD:/work" -w /work node:22-alpine node scripts/check-packed-install.mjs linux-x64-musl

  publish:
    # Tag pushes only (workflow_dispatch runs are rehearsals — see `on:`),
    # so a manual run started from a branch can never reach the publish
    # steps, even with the environment approved.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build, packed-install]
    # Must match the Environment field of the npm Trusted Publisher bindings
    # All eight packages (CLI + seven native targets) require this binding.
    # npm rejects OIDC publishes whose token carries a different/absent
    # environment claim.
    environment: prod
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: 'astria-*'
      - name: Move artifacts
        run: |
          mkdir -p packages/astria-cli/npm
          for dir in artifacts/astria-*/; do
            platform=$(basename "$dir" | sed 's/astria-//')
            mkdir -p "packages/astria-cli/npm/$platform"
            cp "$dir"*.node "packages/astria-cli/npm/$platform/astria.$platform.node"
            for runtime in "$dir"*.dll; do
              [ ! -f "$runtime" ] || cp "$runtime" "packages/astria-cli/npm/$platform/"
            done
          done
      - name: Install dependencies
        run: cd packages/astria-cli && npm ci
      - name: Build CLI
        run: cd packages/astria-cli && npm run build
      - name: Upgrade npm for OIDC
        # Pinned exact: a floating dist-tag inside the OIDC-scoped publish
        # job lets an npm release change publish behavior under a tag push.
        # 11.21.0 is the latest 11.x line (npm 12 exists; this OIDC path is
        # validated on 11.x — re-pin deliberately, never by drift).
        run: |
          npm install -g npm@11.21.0
          hash -r
          npm --version
      - name: Clear token auth for OIDC
        run: |
          npm config delete //registry.npmjs.org/:_authToken
          unset NODE_AUTH_TOKEN
      - name: Create platform packages
        run: cd packages/astria-cli && npx napi create-npm-dirs && node ../../scripts/include-native-runtime.mjs
      - name: Publish platform packages
        # The "Clear token auth" step above only helps the FIRST publish:
        # npm's trusted-publishing exchange caches the package-scoped token it
        # mints in ~/.npmrc, so the next publish for a DIFFERENT package
        # reuses it and fails with ENEEDAUTH (v1.0.0 published exactly one
        # platform package, then died). Remove the cache before every publish
        # so each one mints a fresh token, and treat already-published
        # versions as success so release reruns stay idempotent.
        run: |
          unset NODE_AUTH_TOKEN
          for dir in packages/astria-cli/npm/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # All advertised targets are mandatory; reject empty packages.
            if ! ls "$dir"*.node > /dev/null 2>&1; then
              echo "$name@$version: no binary artifact — release blocked"
              exit 1
            fi
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version already on npm — skipping"
              continue
            fi
            echo "Publishing $name..."
            pushd "$dir"
            rm -f .npmrc "$HOME/.npmrc"
            npm publish --ignore-scripts --access public --provenance 2>publish.log || {
              if grep -q "previously published" publish.log; then
                echo "already published — skipping"
              else
                cat publish.log
                exit 1
              fi
            }
            popd
          done
        env:
          NPM_CONFIG_ACCESS: public
      - name: Publish main package
        # After the platform packages (they are its optional deps) and before
        # the GitHub Release, so a failed publish never leaves a Release
        # announcing an unpublished package.
        run: |
          unset NODE_AUTH_TOKEN
          cd packages/astria-cli
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version already on npm — skipping"
          else
            rm -f .npmrc "$HOME/.npmrc"
            npm publish --ignore-scripts --access public --provenance 2>publish.log || {
              if grep -q "previously published" publish.log; then
                echo "already published — skipping"
              else
                cat publish.log
                exit 1
              fi
            }
          fi
      - name: Wait for npm to serve the published version
        # The MCP Registry validates the published package's mcpName by
        # fetching it from npm, and npm's CDN can 404 a just-published
        # version for a few seconds (v1.0.10 hit exactly this race).
        # Poll until the version is visible, then hard-fail if it never is.
        run: |
          version=$(node -p "require('./packages/astria-cli/package.json').version")
          for i in $(seq 1 24); do
            if npm view "@nodesify/astria@$version" version > /dev/null 2>&1; then
              echo "npm is serving @nodesify/astria@$version"
              break
            fi
            echo "npm not serving $version yet (attempt $i/24) — waiting 5s"
            sleep 5
          done
          npm view "@nodesify/astria@$version" version > /dev/null
      - name: Prepare Homebrew formula update
        # The tap (Nodesify/homebrew-tap) is a separate public repo this
        # workflow cannot push to, so the formula update stays manual (see
        # packaging/homebrew/README.md). Print the exact three lines to
        # paste — hand-deriving them is how the tap lagged releases.
        run: |
          version=$(node -p "require('./packages/astria-cli/package.json').version")
          url="https://registry.npmjs.org/@nodesify/astria/-/astria-${version}.tgz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          echo "Paste into Nodesify/homebrew-tap Formula/astria.rb:"
          echo "  version \"${version}\""
          echo "  url \"${url}\""
          echo "  sha256 \"${sha}\""
          echo "Verify with: brew install --build-from-source nodesify/tap/astria"
      - name: Debug npm auth failure
        if: failure()
        run: |
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo "OIDC endpoint: present" || echo "OIDC endpoint: MISSING"
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo "OIDC request token: present" || echo "OIDC request token: MISSING"
          echo "--- npm version:"; npm --version
          echo "--- npm logs dir:"
          ls -t /home/runner/.npm/_logs/ 2>/dev/null | head -3
          L=$(ls -t /home/runner/.npm/_logs/* 2>/dev/null | head -1)
          [ -n "$L" ] && { echo "--- latest npm debug log ($L):"; cat "$L"; } || echo "none"
      - name: Extract release notes from CHANGELOG.md
        # The tag's "## [X.Y.Z]" section becomes the release body; relative
        # links are rewritten to the tag by the script. generate_release_notes
        # appends the PR list and compare link below the curated notes.
        run: node scripts/extract-changelog.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          generate_release_notes: true
      - name: Publish to the official MCP Registry
        # Last step on purpose: the GitHub Release must exist even when the
        # registry rejects or races (v1.0.9's 403 case mismatch and v1.0.10's
        # npm-CDN race both aborted the job mid-flight and left v1.0.9 with
        # no Release at all). The npm publishes above have already succeeded,
        # so a failure here only delays the directory listing — re-run this
        # failed job to retry, every step is idempotent. `login github-oidc`
        # exchanges the job's OIDC token (id-token: write above) for a
        # registry token and only permits io.github.<owner>/ namespaces —
        # server.json must match the org login's exact case (Nodesify).
        # The publisher is pinned and checksum-verified like the SHA-pinned
        # actions above: this step runs with the job's OIDC and GitHub
        # tokens, so a floating releases/latest download would execute
        # whatever the registry repo most recently shipped. Bump the tag and
        # sha256 together, deliberately. The publish job is ubuntu-only, so
        # the linux_amd64 asset is hardcoded.
        env:
          MCP_PUBLISHER_TAG: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_TAG}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # Rehearsal counterpart of `publish` for workflow_dispatch runs: assembles
  # the exact npm packages a release would publish and packs each with
  # `npm publish --dry-run`. No OIDC token, no environment approval, and
  # nothing leaves the runner. This exists so the expensive failure modes
  # (empty platform packages, malformed generated package.json) surface
  # before a tag burns an immutable npm version — the v1.0.0 single-package
  # publish and the v1.0.12 empty-musl-package archaeology in `publish`.
  rehearse-pack:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build, packed-install]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: 'astria-*'
      - name: Move artifacts
        run: |
          mkdir -p packages/astria-cli/npm
          for dir in artifacts/astria-*/; do
            platform=$(basename "$dir" | sed 's/astria-//')
            mkdir -p "packages/astria-cli/npm/$platform"
            cp "$dir"*.node "packages/astria-cli/npm/$platform/astria.$platform.node"
          done
      - name: Install dependencies
        run: cd packages/astria-cli && npm ci
      - name: Build CLI
        run: cd packages/astria-cli && npm run build
      - name: Create platform packages
        run: cd packages/astria-cli && npx napi create-npm-dirs && node ../../scripts/include-native-runtime.mjs
      - name: Pack rehearsal (npm publish --dry-run)
        run: |
          set -e
          for dir in packages/astria-cli/npm/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if ! ls "$dir"*.node > /dev/null 2>&1; then
              echo "$name@$version: no binary artifact — rehearsal failed"
              exit 1
            fi
            echo "Rehearsing $name@$version"
            (cd "$dir" && npm publish --dry-run --ignore-scripts --access public > /dev/null)
          done
          cd packages/astria-cli
          echo "Rehearsing main package"
          npm publish --dry-run --ignore-scripts --access public > /dev/null
          echo "Rehearsal complete: every package packs cleanly; nothing was published."
