# Build and deploy the docs site; also re-run the benchmark snapshot on demand.

name: Benchmark snapshot

on:
  workflow_dispatch:
  # The Actions-tab button needs the workflow on the default branch; until
  # develop merges to main, push a change to the trigger file to request a run.
  push:
    branches: [develop, main]
    paths: ['.github/bench-trigger']

permissions:
  # Least privilege: only the jobs that push snapshots get write (below).
  contents: read

concurrency:
  group: bench-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    permissions:
      # Commits the snapshot to develop; `gh workflow run` needs actions:write.
      contents: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BENCH_RUNNER_LABEL: ubuntu-24.04 (GitHub Actions)
    steps:
      # Always bench and commit on develop: the snapshot push must go to an
      # unprotected branch (main is PR-only), and the benchmark measures the
      # published npm CLI, not repo HEAD, so the checkout ref doesn't skew
      # results.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      # Deliberate: benchmarks the PUBLISHED CLI from npm, not repo HEAD, so
      # the snapshot reflects what users can actually install today.
      - name: Install astria (published CLI)
        run: npm install -g @nodesify/astria
      # Exact shared-tokenizer counts for the token_parity block (graceful
      # fallback to the heuristic if this step is removed).
      - name: Install shared tokenizer
        run: npm install --no-save js-tiktoken
      - name: Run snapshot benchmark
        run: node scripts/bench/run-snapshot.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/src/data/benchmarks-snapshot.json
          git diff --cached --quiet || git commit -m "chore(bench): update benchmark snapshot"
          # The bench run is long enough that develop may have moved; rebase
          # our snapshot commit (if any) before pushing.
          git pull --rebase origin develop
          git push
      - name: Redeploy docs site
        run: gh workflow run "Deploy docs site" --ref develop
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Blind judging (promptfoo, gated on judge key)
        # Spend control: LLM judging runs ONLY on a manual dispatch by the
        # maintainer. Automated snapshot runs (bench-trigger pushes) never
        # call a paid API, and fork PRs neither trigger this workflow nor
        # receive secrets.
        if: github.event_name == 'workflow_dispatch' && github.actor == 'erictong0602'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Judge model is set in repo Settings > Secrets and variables >
          # Actions > Variables as JUDGE_MODEL (any OpenRouter model id);
          # falls back to the default when unset.
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'openrouter:openai/gpt-4o-mini' }}
          BENCH_CORPUS: ${{ github.workspace }}/bench-work/corpus
          ASTRIA_CMD: astria
          GRAPHIFY_CMD: ${{ github.workspace }}/bench-work/venv/bin/graphify
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not set - skipping blind judging (issue #80)."
            exit 0
          fi
          # The snapshot cleans the original's artifacts before astria runs;
          # rebuild the original's graph so both providers can answer.
          "$([ -x bench-work/venv/bin/python ] && echo bench-work/venv/bin/python || echo bench-work/venv/Scripts/python.exe)"             scripts/bench/orig_run.py "$BENCH_CORPUS" bench-work/orig-judge.json
          node scripts/bench/quality/promptfoo/gen-promptfoo-tests.mjs
          mkdir -p scripts/bench/quality/out
          cd scripts/bench/quality/promptfoo
          # Pinned: this step runs with the judge API key in env, and npx
          # would otherwise execute whatever promptfoo most recently shipped.
          npx --yes promptfoo@0.123.1 eval -c promptfooconfig.yaml --grader "$JUDGE_MODEL" --output ../../out/promptfoo-results.json

      - name: Upload blind-judging results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promptfoo-results
          path: scripts/bench/quality/out/promptfoo-results.json
          if-no-files-found: ignore

  # Retrieval-quality benchmark: the published CLI answering the golden QA
  # set over this repo's own graph. This published-release snapshot is separate
  # from quality.yml, which gates proposed source changes with a local build.
  # Runs after `snapshot` on purpose: both jobs end by rebasing onto develop
  # and pushing, and the workflow-level concurrency group serializes runs,
  # not jobs within a run — run in parallel, one push loses the race.
  quality:
    needs: [snapshot]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install astria (published CLI)
        run: npm install -g @nodesify/astria
      - name: Install shared exact tokenizer
        run: npm install --no-save js-tiktoken
      - name: Build the graph over this repo
        run: astria run .
      - name: Retrieval quality (file hit@k, recall@k, MRR)
        # Blocking with a floor, not a ceiling: the script's default
        # recall@5 floor (50%) fails the run, so ranking regressions gate
        # the snapshot. The floor lives in run-quality.mjs, one home.
        run: node scripts/bench/quality/run-quality.mjs --out website/src/data/quality-snapshot.json
      - name: Commit quality snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/src/data/quality-snapshot.json
          git diff --cached --quiet || git commit -m "chore(bench): update retrieval quality snapshot"
          git pull --rebase origin develop
          git push
