# Blind retrieval-quality judging: both tools answer the same golden
# questions on the same corpus; an LLM rubric grades each answer WITHOUT
# knowing which tool produced it.
#
# Run (repo root):
#   node scripts/bench/quality/promptfoo/gen-promptfoo-tests.mjs   # once per golden change
#   npx promptfoo@latest eval -c scripts/bench/quality/promptfoo/promptfooconfig.yaml \
#       --output scripts/bench/quality/out/promptfoo-results.json
#
# Needs:
#   - a built graph at BENCH_CORPUS (default cwd) + astria CLI (ASTRIA_CMD)
#   - for the second provider: original graphify CLI (GRAPHIFY_CMD) on the
#     same corpus — delete that provider entry to judge astria alone
#   - a judge key visible to promptfoo: ANTHROPIC_API_KEY or OPENAI_API_KEY
description: 'Retrieval quality: astria vs original graphify, same corpus, blind judge'
prompts:
  - '{{question}}'
providers:
  - id: file://astria-provider.js
    label: astria
  - id: file://graphify-provider.js
    label: graphify (original)
tests: tests.generated.yaml
defaultTest:
  # The blind judge runs through OpenRouter (OPENROUTER_API_KEY): one key,
  # any model — switch by editing this id. Needs a model that follows the
  # rubric and returns a verdict reliably (gpt-4o-mini class or above).
  # In CI the repo variable JUDGE_MODEL (Settings > Actions > Variables)
  # overrides this id via --grader; this default applies to local runs.
  # Avoid ~-prefixed OpenRouter aliases: promptfoo's provider parser cannot
  # load them — use pinned ids like openrouter:deepseek/deepseek-v4-flash.
  options:
    provider: openrouter:openai/gpt-4o-mini
  assert:
    - type: llm-rubric
      value: '{{rubric}}'
