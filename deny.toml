# cargo-deny policy: licenses + sources only. Advisories are deliberately
# NOT gated here — rustsec/audit-check in ci.yml already does that job, and
# running two advisory gates invites divergent ignore lists.
#
# Checked by the `deny` job in .github/workflows/ci.yml.

[graph]
# All targets the release actually ships for (mirror release.yml's matrix
# minus the apple/mobile specials cargo-deny treats identically).
all-features = false
no-default-features = false

[licenses]
version = 2
# Allow the permissive set the Rust ecosystem actually ships. Anything
# outside this list fails the build and must be a conscious addition here.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
]
# Confidence threshold for license text detection.
confidence-threshold = 0.93

[[licenses.clarify]]
# ring's license is a compound ISC/OpenSSL expression expressed through
# its package metadata; keep it explicit so upgrades can't surprise.
name = "ring"
expression = "ISC AND OpenSSL AND MIT"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
# Multiple versions of a crate are common transitive noise; warn so the
# report stays visible without gating. Deny-list is empty: add a crate
# here only with a written reason.
multiple-versions = "warn"
wildcards = "deny"
