[workspace]
resolver = "2"
members = [
    "crates/astria-core",
    "crates/astria-paths",
    "crates/astria-detect",
    "crates/astria-extract",
    "crates/astria-build",
    "crates/astria-cluster",
    "crates/astria-analyze",
    "crates/astria-report",
    "crates/astria-query",
    "crates/astria-mcp",
    "crates/astria-napi",
    "crates/astria-semantic",
    "crates/astria-ingest",
    "crates/astria-pdf",
    "crates/astria-embed",
]

[workspace.dependencies]
astria-core = { path = "crates/astria-core" }
astria-paths = { path = "crates/astria-paths" }
astria-detect = { path = "crates/astria-detect" }
astria-extract = { path = "crates/astria-extract" }
astria-build = { path = "crates/astria-build" }
astria-cluster = { path = "crates/astria-cluster" }
astria-analyze = { path = "crates/astria-analyze" }
astria-report = { path = "crates/astria-report" }
astria-query = { path = "crates/astria-query" }
astria-mcp = { path = "crates/astria-mcp" }
astria-semantic = { path = "crates/astria-semantic" }
astria-ingest = { path = "crates/astria-ingest" }
astria-pdf = { path = "crates/astria-pdf" }
astria-embed = { path = "crates/astria-embed" }
rusqlite = { version = "0.34", features = ["bundled"] }
petgraph = "0.7"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
walkdir = "2"
ignore = "0.4"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-scala = "0.26"
tree-sitter-php = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-haskell = "0.23"
tree-sitter-elixir = "0.3"
tree-sitter-bash = "0.25"
tree-sitter-dart = "0.2"
tree-sitter-zig = "1.1"
tree-sitter-css = "0.25"
tree-sitter-kotlin-ng = "1.1"
ureq = "3"
url = "2.5"
pdf-extract = "0.12"
unicode-normalization = "0.1"
toml = "0.8"
strsim = "0.11"
base64 = "0.22"

[workspace.package]
rust-version = "1.88"
