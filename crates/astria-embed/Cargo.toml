[package]
name = "astria-embed"
version = "1.0.0"
edition = "2021"

[dependencies]
astria-core = { workspace = true }
rusqlite = { workspace = true }
# default-features off: the defaults pull native-tls (openssl-sys), which
# breaks cross-compilation for linux-arm64/darwin-x64 release builds;
# rustls keeps identical functionality (model download + ort binaries).
fastembed = { version = "6", default-features = false, features = [
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
] }

[dev-dependencies]
tempfile = "3"
