[package]
name = "astria-analyze"
version = "1.0.0"
edition = "2021"
license = "MIT"
# MSRV floor comes from the dependency tree (ort/napi-sys/time require 1.88)
rust-version.workspace = true
# workspace-internal: distributed via npm (@nodesify/astria), not crates.io
publish = false

[dependencies]
astria-core = { workspace = true }
astria-paths = { workspace = true }
astria-extract = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
petgraph = { workspace = true }

[dev-dependencies]
tempfile = "3"
