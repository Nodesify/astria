[package]
name = "astria-export"
version = "1.0.0"
edition = "2021"
license = "MIT"
# MSRV floor comes from the dependency tree (ort/napi-sys/time require 1.88)
rust-version.workspace = true
# workspace-internal: distributed via npm (@nodesify/astria), not crates.io
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
astria-analyze = { workspace = true }
astria-build = { workspace = true }
astria-core = { workspace = true }
petgraph = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
