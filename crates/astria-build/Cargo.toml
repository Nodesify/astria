[package]
name = "astria-build"
version = "1.0.0"
edition = "2021"
license = "MIT"
# MSRV floor comes from the dependency tree (rusqlite since 0.41 requires 1.89)
rust-version.workspace = true
# workspace-internal: distributed via npm (@nodesify/astria), not crates.io
publish = false

[dependencies]
strsim = { workspace = true }
unicode-normalization = { workspace = true }
astria-core = { workspace = true }
astria-extract = { workspace = true }
astria-paths = { workspace = true }
serde_json = "1"
rusqlite = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = "3"
