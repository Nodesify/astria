[package]
name = "astria-core"
version = "1.0.0"
edition = "2021"
license = "MIT"
# MSRV floor comes from the dependency tree (rusqlite since 0.41 requires 1.89)
rust-version.workspace = true
# workspace-internal: distributed via npm (@nodesify/astria), not crates.io
publish = false

[dependencies]
rusqlite = { workspace = true }
petgraph = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }

fs2 = "0.4"
tempfile = "3"
