[package]
name = "astria-mcp"
version = "1.0.0"
edition = "2021"
license = "MIT"
# MSRV floor comes from the dependency tree (rusqlite since 0.41 requires 1.89)
rust-version.workspace = true
# workspace-internal: distributed via npm (@nodesify/astria), not crates.io
publish = false

[features]
default = []
embed = ["astria-query/embed"]

[dependencies]
astria-core = { workspace = true }
astria-paths = { workspace = true }
astria-query = { workspace = true }
astria-analyze = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
